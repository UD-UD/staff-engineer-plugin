<svg viewBox="0 0 1200 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The se status board in a terminal">
  <rect width="1200" height="470" rx="12" fill="#14191F"/>
  <path d="M0 12 A12 12 0 0 1 12 0 H1188 A12 12 0 0 1 1200 12 V40 H0 Z" fill="#1D242C"/>
  <circle cx="24" cy="20" r="6" fill="#39434E"/>
  <circle cx="44" cy="20" r="6" fill="#39434E"/>
  <circle cx="64" cy="20" r="6" fill="#39434E"/>
  <text x="600" y="25" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#7C8A99">~/work/taskly — the morning after a shutdown</text>
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" xml:space="preserve">
    <text x="30" y="78"  fill="#8CC8F0">$ se</text>
    <text x="30" y="104" fill="#D5DDE5">se · repo: taskly · base: main · 3 worktree(s)</text>
    <text x="30" y="156" fill="#7C8A99">BRANCH                     GIT            TODO   NEXT STEP                        LAST SESSION</text>
    <text x="30" y="182" fill="#D5DDE5">main                       clean          -      -                                11h · Taskly project setup and planning (1)</text>
    <text x="30" y="208" fill="#D5DDE5">worktree-dark-mode         clean          -      -                                none — fresh</text>
    <text x="30" y="234" fill="#D5DDE5">worktree-rate-limit        dirty:1 +2     3/4    3. 429 + Retry-After header      6h · Rate limiting middleware (1)</text>
    <text x="30" y="286" fill="#E8796B">Anomalies:</text>
    <text x="30" y="312" fill="#E8796B">  ! worktree-dark-mode — no plan file in docs/plan/ → start one with /se:plan</text>
    <text x="30" y="364" fill="#6FC495">Resume (most recent first):</text>
    <text x="30" y="390" fill="#6FC495">  cd ~/work/taskly/.claude/worktrees/rate-limit &amp;&amp; claude --continue    # worktree-rate-limit</text>
    <text x="30" y="416" fill="#6FC495">  cd ~/work/taskly &amp;&amp; claude --continue    # main</text>
    <text x="30" y="442" fill="#6FC495">  cd ~/work/taskly/.claude/worktrees/dark-mode &amp;&amp; claude    # worktree-dark-mode — fresh, no saved session</text>
  </g>
</svg>
