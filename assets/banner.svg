<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="se — Staff Engineer: a Claude Code plugin">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1D6FA5" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="14" fill="#14191F"/>
  <rect width="1200" height="300" rx="14" fill="url(#grid)"/>

  <!-- branch-line motif: main line with a feature branch diverging and merging -->
  <path d="M60 240 H1140" fill="none" stroke="#4A5766" stroke-width="3"/>
  <path d="M300 240 C 360 240 360 190 420 190 H 880 C 940 190 940 240 1000 240"
        fill="none" stroke="#1D6FA5" stroke-width="3"/>
  <circle cx="180" cy="240" r="7" fill="#14191F" stroke="#7C8A99" stroke-width="3"/>
  <circle cx="300" cy="240" r="7" fill="#14191F" stroke="#7C8A99" stroke-width="3"/>
  <circle cx="500" cy="190" r="7" fill="#14191F" stroke="#8CC8F0" stroke-width="3"/>
  <circle cx="650" cy="190" r="7" fill="#14191F" stroke="#8CC8F0" stroke-width="3"/>
  <circle cx="800" cy="190" r="7" fill="#14191F" stroke="#8CC8F0" stroke-width="3"/>
  <circle cx="1000" cy="240" r="7" fill="#14191F" stroke="#6FC495" stroke-width="3"/>
  <text x="500" y="168" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#7C8A99">plan</text>
  <text x="628" y="168" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#7C8A99">build</text>
  <text x="772" y="168" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#7C8A99">review</text>
  <text x="978" y="270" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#6FC495">merge</text>
  <text x="272" y="270" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#7C8A99">worktree</text>

  <!-- monogram + wordmark -->
  <text x="80" y="140" font-family="Georgia, 'Times New Roman', serif" font-size="104" font-weight="bold" fill="#8CC8F0">se</text>
  <rect x="228" y="52" width="2" height="96" fill="#2A3441"/>
  <text x="262" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="bold" fill="#D5DDE5" letter-spacing="6">STAFF ENGINEER</text>
  <text x="264" y="128" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#7C8A99">A Claude Code plugin that plans, builds, reviews and ships</text>
  <text x="264" y="152" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#7C8A99">like a staff engineer — one worktree per feature, main untouched.</text>
</svg>
