<svg viewBox="0 0 1200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The five layers: principles, skills, agents, hooks, CLI">
  <!-- panel 1: PRINCIPLES -->
  <g>
    <rect x="0" y="0" width="227" height="200" rx="12" fill="#14191F" stroke="#6FC495" stroke-opacity="0.55" stroke-width="1.5"/>
    <circle cx="26" cy="34" r="5" fill="#6FC495"/>
    <text x="42" y="40" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="17" font-weight="bold" fill="#6FC495">PRINCIPLES</text>
    <text x="26" y="66" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#7C8A99">always on</text>
    <text x="26" y="100" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#D5DDE5">Nine rules injected at</text>
    <text x="26" y="122" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#D5DDE5">every session start —</text>
    <text x="26" y="144" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#D5DDE5">never age out of context.</text>
  </g>
  <!-- panel 2: SKILLS -->
  <g transform="translate(243,0)">
    <rect x="0" y="0" width="227" height="200" rx="12" fill="#14191F" stroke="#8CC8F0" stroke-opacity="0.55" stroke-width="1.5"/>
    <circle cx="26" cy="34" r="5" fill="#8CC8F0"/>
    <text x="42" y="40" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="17" font-weight="bold" fill="#8CC8F0">SKILLS</text>
    <text x="26" y="66" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#7C8A99">on demand</text>
    <text x="26" y="100" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#D5DDE5">/se:plan · review · test</text>
    <text x="26" y="122" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#D5DDE5">commit · pr · worktree</text>
    <text x="26" y="144" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#D5DDE5">setup · status</text>
  </g>
  <!-- panel 3: AGENTS -->
  <g transform="translate(486,0)">
    <rect x="0" y="0" width="227" height="200" rx="12" fill="#14191F" stroke="#A78BD4" stroke-opacity="0.55" stroke-width="1.5"/>
    <circle cx="26" cy="34" r="5" fill="#A78BD4"/>
    <text x="42" y="40" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="17" font-weight="bold" fill="#A78BD4">AGENTS</text>
    <text x="26" y="66" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#7C8A99">delegated</text>
    <text x="26" y="100" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#D5DDE5">Parallel Sonnet builders,</text>
    <text x="26" y="122" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#D5DDE5">a fresh-eyes reviewer, a</text>
    <text x="26" y="144" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#D5DDE5">plain-English explainer.</text>
  </g>
  <!-- panel 4: HOOKS -->
  <g transform="translate(729,0)">
    <rect x="0" y="0" width="227" height="200" rx="12" fill="#14191F" stroke="#E8796B" stroke-opacity="0.55" stroke-width="1.5"/>
    <circle cx="26" cy="34" r="5" fill="#E8796B"/>
    <text x="42" y="40" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="17" font-weight="bold" fill="#E8796B">HOOKS</text>
    <text x="26" y="66" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#7C8A99">deterministic</text>
    <text x="26" y="100" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#D5DDE5">Git guardrails in shell —</text>
    <text x="26" y="122" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#D5DDE5">they cannot be</text>
    <text x="26" y="144" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#D5DDE5">persuaded.</text>
  </g>
  <!-- panel 5: CLI -->
  <g transform="translate(972,0)">
    <rect x="0" y="0" width="227" height="200" rx="12" fill="#14191F" stroke="#9AA8B7" stroke-opacity="0.55" stroke-width="1.5"/>
    <circle cx="26" cy="34" r="5" fill="#9AA8B7"/>
    <text x="42" y="40" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="17" font-weight="bold" fill="#9AA8B7">CLI</text>
    <text x="26" y="66" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#7C8A99">zero LLM</text>
    <text x="26" y="100" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#D5DDE5">The se status board:</text>
    <text x="26" y="122" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#D5DDE5">instant, token-free,</text>
    <text x="26" y="144" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#D5DDE5">correct after a reboot.</text>
  </g>
</svg>
